name: Compilar y probar

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Permiso para publicar la versión descargable (Release) al fusionar en main.
permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      # Motor exacto del módulo Diseño 3D: OpenCASCADE precompilado de conda-forge + envoltorio nativo simcad_occt.
      - name: Instalar OpenCASCADE
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: occt
          create-args: occt=7.8.*=novtk*
          condarc: |
            channels:
              - conda-forge
          cache-environment: true
      - name: Compilar envoltorio de OpenCASCADE
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $prefix = (Join-Path $env:MAMBA_ROOT_PREFIX "envs/occt/Library") -replace '\\','/'
          $env:OCCT_BIN_DIRS = "$prefix/bin"
          cmake -S native/simcad_occt -B native/build -A x64 "-DOpenCASCADE_DIR=$prefix/lib/cmake/opencascade"
          cmake --build native/build --config Release
          cmake --install native/build --config Release --prefix native/bin
          Get-ChildItem native/bin | Select-Object Name, Length
      - name: Descargar ngspice (motor de simulación)
        shell: pwsh
        run: |
          $url = "https://downloads.sourceforge.net/project/ngspice/ng-spice-rework/old-releases/45.2/ngspice-45.2_dll_64.7z"
          curl.exe -L --fail --retry 4 --retry-delay 5 -o ngspice.7z $url
          $hash = (Get-FileHash ngspice.7z -Algorithm SHA256).Hash
          if ($hash -ne "FF110EBB04367EB37FF3C88C75AB3BEA1B2191C11EFCE78F264C2CA73034762B") { throw "El archivo de ngspice no es el esperado: $hash" }
          7z x ngspice.7z -ongspice-pkg -y | Out-Null
          $dll = Join-Path $pwd "ngspice-pkg\Spice64_dll\dll-vs\ngspice.dll"
          if (-not (Test-Path $dll)) { throw "No se encontró ngspice.dll en el paquete" }
          "NGSPICE_LIBRARY_PATH=$dll" >> $env:GITHUB_ENV
      - name: Compilar
        run: dotnet build -c Release
      - name: Pruebas
        env:
          CAD3D_REQUIRE_OCCT: "1"
        run: dotnet test -c Release --no-build
      - name: Publicar ejecutable para Windows (x64)
        run: dotnet publish src/Simulador.App -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o publish/SimuladorMultiple
      - name: Añadir ngspice y el runtime de Visual C++ al ejecutable
        shell: pwsh
        run: |
          Copy-Item $env:NGSPICE_LIBRARY_PATH publish/SimuladorMultiple/
          foreach ($f in "vcruntime140.dll", "vcruntime140_1.dll", "msvcp140.dll", "vcomp140.dll") {
            $src = Join-Path $env:WINDIR "System32\$f"
            if (Test-Path $src) { Copy-Item $src publish/SimuladorMultiple/ }
          }
      - name: Subir ejecutable
        uses: actions/upload-artifact@v4
        with:
          name: SimuladorMultiple-win-x64
          path: publish/SimuladorMultiple
      - name: Crear instalador y ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc /Q "/DAppVersion=0.1.${{ github.run_number }}" "/DSourceDir=$pwd\publish\SimuladorMultiple" "/DOutputDir=$pwd\dist" installer\SimuladorMultiple.iss
          Compress-Archive -Path publish/SimuladorMultiple/* -DestinationPath dist/SimuladorMultiple-portable.zip
          Get-ChildItem dist | Select-Object Name, Length
      - name: Subir instalador
        uses: actions/upload-artifact@v4
        with:
          name: SimuladorMultiple-Setup
          path: dist/SimuladorMultiple-Setup.exe
      - name: Publicar versión descargable
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Simulador multiple 0.1.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Versión para Windows 11 (64 bits).

            - **SimuladorMultiple-Setup.exe**: instalador. Descárgalo, ábrelo y sigue los pasos.
            - **SimuladorMultiple-portable.zip**: sin instalar. Descomprímelo y abre SimuladorMultiple.exe.
          files: |
            dist/SimuladorMultiple-Setup.exe
            dist/SimuladorMultiple-portable.zip
